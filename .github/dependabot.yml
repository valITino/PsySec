version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Am ersten Tag des Monats. Sicherheitsupdates kommen unabhängig davon sofort,
    # sobald «Dependabot security updates» im Repository eingeschaltet ist.
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Zurich
    open-pull-requests-limit: 8
    ignore:
      # Die Typen folgen der Node-Version, die wirklich läuft (.nvmrc: 22). Typen einer
      # neueren Hauptversion passen nicht dazu und brechen den Typecheck.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Hauptversionen von TypeScript bewusst von Hand: typescript-eslint unterstützt
      # TypeScript 7.0 nicht (Lint bricht ab). Regel entfernen, sobald das geklärt ist.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*', 'hono']
      tests:
        patterns: ['vitest', '@vitest/*', '@playwright/test', '@axe-core/*']
      lint:
        patterns:
          [
            'eslint',
            '@eslint/*',
            'eslint-*',
            'typescript-eslint',
            'prettier',
            'prettier-*',
            'globals',
          ]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Zurich
    commit-message:
      prefix: ci
